name: Release

# 发布版本：只在推送 v* tag 时触发，独立完成构建并创建 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          BASE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 Android 签名密钥，将使用 debug 签名构建"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/flupix-release.jks
          {
            echo "storeFile=flupix-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: flutter build apk --release --build-name="$VERSION" --build-number="$CODE"

      - name: Collect artifact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Flupix-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Flupix-*-android.apk
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: flutter build windows --release --build-name="$env:VERSION" --build-number="$env:CODE"

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match 'runner' } |
            Select-Object -First 1
          if (-not $releaseDir) { throw "未找到 Windows 构建输出目录" }
          Compress-Archive -Path (Join-Path $releaseDir.FullName '*') `
            -DestinationPath "Flupix-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Flupix-*-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          name: Flupix ${{ github.ref_name }}
          body: |
            ## 下载

            - **Android**：安装 `Flupix-*-android.apk`
            - **Windows**：解压 `Flupix-*-windows-x64.zip`，运行 `flupix.exe`

            本版本由 GitHub Actions 自动构建发布。
