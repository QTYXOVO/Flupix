name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '1.0.0'
        required: true
        default: '0.0.1'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          PATCH="${PATCH:-0}"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^version: .*/version: ${VERSION}+${CODE}/" pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 Android 签名密钥，将使用 debug 签名构建"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/flupix-release.jks
          {
            echo "storeFile=flupix-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Collect artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Flupix-${{ steps.version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Flupix-*-android.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          }
          $parts = $version.Split("-")[0].Split(".")
          $major = [int]$parts[0]
          $minor = if ($parts.Length -gt 1) { [int]$parts[1] } else { 0 }
          $patch = if ($parts.Length -gt 2) { [int]$parts[2] } else { 0 }
          $code = $major * 10000 + $minor * 100 + $patch
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $version+$code" | Set-Content pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match 'runner' } |
            Select-Object -First 1
          if (-not $releaseDir) { throw "未找到 Windows 构建输出目录" }
          Compress-Archive -Path (Join-Path $releaseDir.FullName '*') `
            -DestinationPath "Flupix-${{ steps.version.outputs.version }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Flupix-*-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          name: Flupix ${{ github.ref_name }}
          body: |
            ## 下载

            - **Android**：安装 `Flupix-*-android.apk`
            - **Windows**：解压 `Flupix-*-windows-x64.zip`，运行 `flupix.exe`

            本版本由 GitHub Actions 自动构建发布。
