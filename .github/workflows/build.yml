name: Build

# 构建版本：push / PR / 手动触发，只产出 artifact，不创建 Release。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号（留空则使用 pubspec.yaml 中的版本）'
        required: false
        default: ''

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            BASE="${VERSION%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            MINOR="${MINOR:-0}"
            PATCH="${PATCH:-0}"
            CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          else
            LINE=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//')
            VERSION="${LINE%%+*}"
            CODE="${LINE#*+}"
            if [ "$CODE" = "$LINE" ]; then
              CODE=1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    needs: [prepare, analyze-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 Android 签名密钥，将使用 debug 签名构建"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/flupix-release.jks
          {
            echo "storeFile=flupix-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK (split per ABI)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$CODE"

      - name: Build universal APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: flutter build apk --release --build-name="$VERSION" --build-number="$CODE"

      - name: Collect artifact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "Flupix-${VERSION}-android-${abi}.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Flupix-${VERSION}-android-universal.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Flupix-*-android-*.apk
          if-no-files-found: error

  build-windows:
    needs: [prepare, analyze-and-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: flutter build windows --release --build-name="$env:VERSION" --build-number="$env:CODE"

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match 'runner' } |
            Select-Object -First 1
          if (-not $releaseDir) { throw "未找到 Windows 构建输出目录" }
          Compress-Archive -Path (Join-Path $releaseDir.FullName '*') `
            -DestinationPath "Flupix-$env:VERSION-windows-x64.zip"

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          & $iscc "/DMyAppVersion=$env:VERSION" "/DMyAppBuild=$env:CODE" "installer\flupix.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: Hash installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Flupix-*-windows-x64-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "未找到安装包" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -NoNewline -Encoding ascii "$($setup.FullName).sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            Flupix-*-windows-x64.zip
            dist/Flupix-*-windows-x64-setup.exe
            dist/Flupix-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
